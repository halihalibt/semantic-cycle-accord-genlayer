[project]
name = "semantic-cycle-accord-genlayer"
version = "0.1.0"
description = "SCA-3 V1 deterministic GenLayer contract core"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["genlayer-test==0.29.2", "genvm-linter==0.11.0", "pytest==9.1.1", "ruff==0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
